name: Build & Release UniClip

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Build Android Release APK
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniClip-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  # Build Windows Desktop Release (.exe)
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Archive Windows Release
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "UniClip-Windows.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniClip-Windows-Release
          path: UniClip-Windows.zip

  # Publish GitHub Release with binaries attached
  release:
    name: Publish Release
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: UniClip-Android-APK
          path: release-assets/android

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: UniClip-Windows-Release
          path: release-assets/windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: UniClip ${{ github.ref_name }} - Cross-Platform Universal Clipboard
          body: |
            ## 🎉 UniClip ${{ github.ref_name }} Release

            Instant, cross-platform clipboard synchronization like Apple's iOS Universal Clipboard for Android and Windows.

            ### 📥 Direct Downloads:
            * 📱 **Android**: Download `app-release.apk` below and install directly.
            * 💻 **Windows**: Download `UniClip-Windows.zip` below, extract, and launch `global_clipboard.exe`.

            ### ✨ Upgrades in v1.1.0:
            * **Direct IP Auto-Connect**: Automatic LAN WebSocket connections without relying on mDNS multicast filters
            * **Android Background Service**: Native background clipboard listener and instant resume sync
            * **Resilient Multi-Key Decryption**: Automatic key fallback across all paired devices
            * **1-Tap Sync Now**: Manual trigger button in Quick Actions
          files: |
            release-assets/android/*
            release-assets/windows/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
