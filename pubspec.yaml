name: global_clipboard
description: "Global Clipboard - Copy on one device, paste on another. Like iOS Universal Clipboard for Android & Windows."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Networking
  bonsoir: ^5.1.4
  web_socket_channel: ^3.0.2
  
  # Security
  pointycastle: ^3.9.1
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.4
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.9
  
  # Database
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.30
  
  # Storage
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.1
  
  # Utils
  uuid: ^4.5.1
  crypto: ^3.0.6
  collection: ^1.19.1
  logging: ^1.3.0
  
  # Platform-specific  
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
